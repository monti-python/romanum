openapi: 3.0.0
info:
  title: Romanum
  description: Convert a range of numbers to Roman numerals
  version: 1.0.0
paths:
  /convert:
    get:
      summary: Convert a range of numbers to Roman numerals
      parameters:
        - in: query
          name: start
          schema:
            type: integer
            format: int64
            minimum: 1
          required: true
          description: The starting number of the range (1-3999)
          example: 3
        - in: query
          name: end
          schema:
            type: integer
            format: int64
            maximum: 3999
          required: true
          description: The ending number of the range (1-3999)
          example: 5
        - in: query
          name: system
          schema:
            type: string
            enum: [roman, binary, hexadecimal]
          required: false
          description: The numerical system to convert to (default is "roman")
          example: roman
      responses:
        '200':
          description: A map of numbers to their Roman representations
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: object
                  properties:
                    number:
                      type: integer
                    converted:
                      type: string
                example:
                  - number: 3
                    converted: "III"
                  - number: 4
                    converted: "IV"
                  - number: 5
                    converted: "V"
        '400':
          description: Invalid input
        '500':
          description: Internal server error
